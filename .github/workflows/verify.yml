name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Check SOURCES.md is generated from the manifest
        working-directory: verification
        run: python3 gen_sources_md.py --check

      - name: Run verification harness
        working-directory: verification
        run: |
          set -o pipefail          # without this the exit code comes from tee, not the harness
          python3 verify_si.py \
            --new  "../Special Inspector Qualification 2024 IBC rev18.xlsx" \
            --orig "../reference/Special Inspection Qualifications 082625 (original from DPP).xlsx" \
            | tee verification-report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: verification/verification-report.txt
